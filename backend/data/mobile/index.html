<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Escáner de actas electorales - Sistema RRV Bolivia">
  <title>Escáner de Actas - RRV Bolivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ═══ LOGIN VIEW ═══ -->
  <div id="view-login" class="view active">
    <div class="login-container">
      <div class="logo-section">
        <div class="logo-icon">🗳️</div>
        <h1>RRV Bolivia</h1>
        <p class="subtitle">Escáner Móvil de Actas</p>
      </div>
      <form id="login-form" class="form-card">
        <div class="input-group">
          <label for="login-user">Usuario</label>
          <input id="login-user" type="text" placeholder="admin" required autocomplete="username">
        </div>
        <div class="input-group">
          <label for="login-pass">Contraseña</label>
          <input id="login-pass" type="password" placeholder="••••••" required autocomplete="current-password">
        </div>
        <button type="submit" id="btn-login" class="btn-primary">
          <span class="btn-text">Ingresar</span>
          <span class="btn-loader hidden">⏳</span>
        </button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <!-- ═══ SCANNER VIEW ═══ -->
  <div id="view-scanner" class="view">
    <header class="app-header">
      <h2>📷 Escáner de Actas</h2>
      <div class="header-actions">
        <button id="btn-history" class="btn-icon" title="Historial">📋</button>
        <button id="btn-logout" class="btn-icon" title="Salir">🚪</button>
      </div>
    </header>

    <main class="scanner-main">
      <!-- Capture Section -->
      <div class="capture-card">
        <div id="preview-area" class="preview-area">
          <img id="img-preview" class="hidden" alt="Vista previa del acta">
          <div id="placeholder" class="placeholder">
            <span class="camera-icon">📸</span>
            <p>Toca para capturar el acta</p>
          </div>
        </div>
        <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden">
        <div class="capture-actions">
          <button id="btn-capture" class="btn-capture">
            <span>📷</span> Capturar Acta
          </button>
          <button id="btn-gallery" class="btn-secondary">
            <span>🖼️</span> Galería
          </button>
        </div>
      </div>

      <!-- Optional Acta Code -->
      <div class="code-card">
        <div class="input-group">
          <label for="codigo-acta">Código de Acta (opcional)</label>
          <input id="codigo-acta" type="number" placeholder="Ej: 35000">
        </div>
      </div>

      <!-- Upload Button -->
      <button id="btn-upload" class="btn-upload hidden" disabled>
        <span class="btn-text">🚀 Procesar Acta</span>
        <span class="btn-loader hidden">Procesando...</span>
      </button>

      <!-- Result Section -->
      <div id="result-section" class="result-card hidden">
        <div id="result-header" class="result-header">
          <span id="result-icon"></span>
          <span id="result-status"></span>
        </div>
        <div id="result-details" class="result-details"></div>
      </div>
    </main>
  </div>

  <!-- ═══ HISTORY VIEW ═══ -->
  <div id="view-history" class="view">
    <header class="app-header">
      <button id="btn-back" class="btn-icon">⬅️</button>
      <h2>📋 Historial de Escaneos</h2>
    </header>
    <div id="history-list" class="history-list">
      <p class="loading-text">Cargando historial...</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
